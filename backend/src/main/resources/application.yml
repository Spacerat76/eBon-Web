server:
  port: 8080

spring:
  application:
    name: ebon-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ebon}
    username: ${DB_USER:ebon}
    password: ${DB_PASSWORD:change_me_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    api-token: ${APP_API_TOKEN:change_me_local_dev_token}
  openapi:
    public-access: ${APP_OPENAPI_PUBLIC_ACCESS:true}
  paperless:
    base-url: ${PAPERLESS_BASE_URL:http://localhost:8000}
    public-base-url: ${PAPERLESS_PUBLIC_BASE_URL:${PAPERLESS_BASE_URL:http://localhost:8000}}
    document-url-template: ${PAPERLESS_DOCUMENT_URL_TEMPLATE:}
    api-token: ${PAPERLESS_API_TOKEN:change_me_paperless_token}
    ebon-tag: ${PAPERLESS_EBON_TAG:eBON}
  ai:
    openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openai/gpt-oss-20b}
    max-tokens: ${OPENROUTER_MAX_TOKENS:500}
    temperature: ${OPENROUTER_TEMPERATURE:0.1}
    parsing:
      fallback-enabled: ${AI_PARSING_FALLBACK_ENABLED:true}
      model: ${OPENROUTER_PARSING_MODEL:${OPENROUTER_MODEL:openai/gpt-oss-20b}}
      max-tokens: ${OPENROUTER_PARSING_MAX_TOKENS:2500}
      temperature: ${OPENROUTER_PARSING_TEMPERATURE:0.0}
      min-confidence: ${AI_PARSING_MIN_CONFIDENCE:0.900}
      sync-call-limit: ${AI_PARSING_SYNC_CALL_LIMIT:25}
      text-mode: ${AI_PARSING_TEXT_MODE:MINIMIZED}
      store-debug-snippets: ${AI_PARSING_STORE_DEBUG_SNIPPETS:false}
  parser:
    dm-branch-mappings:
      D482: Am Reuschenberger Markt 3, 41466 Neuss
      D5A4: Holzheimer Weg 44, 41464 Neuss
  sync:
    scheduler:
      enabled: ${SYNC_SCHEDULER_ENABLED:true}
      interval-minutes: ${SYNC_INTERVAL_MINUTES:60}
      initial-delay-ms: ${SYNC_INITIAL_DELAY_MS:3600000}
  backup:
    rolling:
      enabled: ${ROLLING_BACKUP_ENABLED:false}
      directory: ${ROLLING_BACKUP_DIRECTORY:backups/automatic}
      cron: "${ROLLING_BACKUP_CRON:0 0 3 * * *}"
      retention-count: ${ROLLING_BACKUP_RETENTION_COUNT:7}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
