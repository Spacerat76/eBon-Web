spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/ebon}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: filesystem:db/migrations

ebon:
  paperless-base-url: ${PAPERLESS_BASE_URL:}
  paperless-api-token: ${PAPERLESS_API_TOKEN:}
  paperless-ebon-tag: ${PAPERLESS_EBON_TAG:eBON}
  openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  openrouter-model: ${OPENROUTER_MODEL:}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  app-api-token: ${APP_API_TOKEN:}
  sync-interval-minutes: ${SYNC_INTERVAL_MINUTES:60}
  ai-rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
