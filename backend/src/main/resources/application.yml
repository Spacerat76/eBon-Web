server:
  port: 8080

spring:
  application:
    name: ebon-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ebon}
    username: ${DB_USER:ebon}
    password: ${DB_PASSWORD:change_me_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    api-token: ${APP_API_TOKEN:change_me_local_dev_token}
  openapi:
    public-access: ${APP_OPENAPI_PUBLIC_ACCESS:true}
  paperless:
    base-url: ${PAPERLESS_BASE_URL:http://localhost:8000}
    api-token: ${PAPERLESS_API_TOKEN:change_me_paperless_token}
    ebon-tag: ${PAPERLESS_EBON_TAG:eBON}
  ai:
    openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemini-flash-1.5}
    max-tokens: ${OPENROUTER_MAX_TOKENS:500}
    temperature: ${OPENROUTER_TEMPERATURE:0.1}
  sync:
    scheduler:
      enabled: ${SYNC_SCHEDULER_ENABLED:true}
      interval-minutes: ${SYNC_INTERVAL_MINUTES:60}
      initial-delay-ms: ${SYNC_INITIAL_DELAY_MS:3600000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
